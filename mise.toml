[tools]
go = "1.26.6"
# mockery is not installed by mise: it's the `tool` in each module's go.mod, so Dependabot keeps it current.
# Run it with `go tool mockery`.

# sdk/ and api/ are separate Go modules with their own go.mod, .mockery.yml and mockery pin.
# Each task runs inside its module, deleting the previous output first so mocks of
# interfaces that were removed upstream don't linger.
[tasks."mockery:sdk"]
description = "Regenerate the SDK mocks against the SDK version pinned in sdk/go.mod"
dir = "{{config_root}}/sdk"
run = [
  "grep -rl --include='*.go' 'Code generated by mockery' . | xargs rm -f",
  "go tool mockery",
  "go mod tidy",
]

[tasks."mockery:api"]
description = "Regenerate the api mocks against the api version pinned in api/go.mod"
dir = "{{config_root}}/api"
run = [
  "grep -rl --include='*.go' 'Code generated by mockery' . | xargs rm -f",
  "go tool mockery",
  "go mod tidy",
]

[tasks.mockery]
description = "Regenerate all mocks"
depends = ["mockery:sdk", "mockery:api"]
